<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitud de inspección · GUVEL Quality</title>
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); display: flex; flex-direction: column; align-items: center; padding: 32px 16px 60px; }
  .k-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .k-brand img { height: 34px; }
  .k-brand b { font-size: 18px; letter-spacing: .02em; }
  .k-card { width: 100%; max-width: 640px; background: var(--surface); border: 1px solid var(--line); padding: 28px 28px 24px; }
  .k-card h1 { font-size: 22px; margin: 0 0 4px; }
  .k-card p.lead { color: var(--text-2); margin: 0 0 22px; font-size: 14px; }
  .k-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .k-field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .k-field.span2 { grid-column: 1 / -1; }
  .k-field label { font-size: 13.5px; font-weight: 500; color: var(--text-2); }
  .k-field label i { color: var(--stop-ink); font-style: normal; }
  .k-field input, .k-field select, .k-field textarea {
    width: 100%; min-height: 38px; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--r);
    background: var(--surface); color: var(--ink); font: inherit;
  }
  .k-field textarea { min-height: 70px; resize: vertical; }
  .k-field input:focus, .k-field select:focus, .k-field textarea:focus { outline: none; border-color: var(--flow); box-shadow: 0 0 0 1px var(--flow); }
  .k-part-name { font-size: 13px; color: var(--text-2); margin-top: 2px; min-height: 16px; }
  .k-submit { margin-top: 22px; width: 100%; min-height: 44px; background: var(--ink); color: var(--surface); border: 0; border-radius: var(--r); font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; }
  .k-submit:hover { background: var(--navy-3); }
  .k-submit:disabled { opacity: .5; cursor: default; }
  .k-msg { margin-top: 14px; padding: 10px 12px; font-size: 14px; border-left: 3px solid var(--flow); background: var(--flow-soft); color: var(--ink); display: none; }
  .k-msg.show { display: block; }
  .k-msg.error { border-left-color: var(--stop); background: var(--stop-soft); }
  .k-msg.ok { border-left-color: var(--ok); background: var(--ok-soft); }
  .k-success { text-align: center; padding: 30px 10px; }
  .k-success svg { width: 48px; height: 48px; color: var(--ok-ink); margin-bottom: 12px; }
  .k-success h2 { font-size: 20px; margin: 0 0 8px; }
  .k-success p { color: var(--text-2); margin: 0; }
  .k-again { margin-top: 20px; background: transparent; border: 1px solid var(--line); color: var(--ink); padding: 9px 16px; border-radius: var(--r); font: inherit; cursor: pointer; }
  .k-empty { text-align: center; padding: 40px 10px; color: var(--text-2); }
  .k-foot { margin-top: 20px; font-size: 12.5px; color: var(--text-3); }
</style>
</head>
<body>
  <div class="k-brand"><img src="assets/icons/icon-192.png" alt=""><b>GUVEL QUALITY</b></div>
  <div class="k-card" id="card">
    <div class="k-empty">Cargando…</div>
  </div>
  <div class="k-foot" id="foot"></div>

<script type="module">
import { CONFIG, isDemo } from "./js/config.js";

const card = document.getElementById("card");
const foot = document.getElementById("foot");

/** quality.guvelsystems.com → "guvel" · quality.<slug>.guvelsystems.com → "<slug>" */
function slugFromHost(hostname = location.hostname) {
  if (hostname === "quality.guvelsystems.com") return "guvel";
  const m = /^quality\.([a-z0-9-]+)\.guvelsystems\.com$/.exec(hostname);
  if (m) return m[1];
  const q = new URLSearchParams(location.search).get("empresa");   // pruebas locales: ?empresa=slug
  return q || null;
}

const SERVICE_TYPES = ["Primera pieza", "Dimensional completo", "Recurrente", "Layout", "Otro"];

async function boot() {
  const slug = slugFromHost();
  if (!slug) { card.innerHTML = `<div class="k-empty">No se pudo identificar la empresa de este enlace.</div>`; return; }
  if (isDemo) { card.innerHTML = `<div class="k-empty">Este Kiosk necesita estar conectado a Supabase (modo demo no soportado aquí).</div>`; return; }

  await new Promise((res, rej) => { const el = document.createElement("script"); el.src = "js/vendor/supabase.umd.js"; el.onload = res; el.onerror = () => rej(new Error("No se pudo cargar la librería")); document.head.append(el); });
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

  const [{ data: companyId, error: e1 }, { data: parts, error: e2 }] = await Promise.all([
    sb.rpc("company_id_by_slug", { p_slug: slug }),
    sb.rpc("inspection_kiosk_parts", { p_slug: slug }),
  ]);
  if (e1 || !companyId) { card.innerHTML = `<div class="k-empty">No encontramos una empresa para este enlace.</div>`; return; }
  if (e2) { card.innerHTML = `<div class="k-empty">No se pudieron cargar los números de parte. Intenta de nuevo más tarde.</div>`; return; }
  foot.textContent = `Solicitudes de inspección — ${slug}`;

  if (!parts.length) {
    card.innerHTML = `<h1>Solicitud de inspección</h1><div class="k-empty">Todavía no hay números de parte disponibles para inspección. Contacta a Calidad.</div>`;
    return;
  }

  card.innerHTML = `
    <h1>Solicitud de inspección</h1>
    <p class="lead">Completa los datos para solicitar una inspección dimensional.</p>
    <form id="kf" novalidate>
      <div class="k-grid">
        <div class="k-field"><label>Solicitante — nombre <i>*</i></label><input name="requester_name" required></div>
        <div class="k-field"><label>Solicitante — correo <i>*</i></label><input type="email" name="requester_email" required></div>
        <div class="k-field"><label>Turno</label><select name="shift"><option value="">— Elegir —</option><option>1</option><option>2</option><option>3</option></select></div>
        <div class="k-field"><label>Cantidad</label><input type="number" min="0" name="quantity"></div>
        <div class="k-field"><label>No. de lote</label><input name="lot_number"></div>
        <div class="k-field"><label>Orden de compra</label><input name="purchase_order"></div>
        <div class="k-field span2">
          <label>Número de parte <i>*</i></label>
          <select name="format_id" required><option value="">— Elegir número de parte —</option>${parts.map((p) => `<option value="${p.format_id}" data-name="${esc(p.part_name)}">${esc(p.part_number)}</option>`).join("")}</select>
          <div class="k-part-name" id="partName"></div>
        </div>
        <div class="k-field"><label>No. de operación</label><input name="operation_no"></div>
        <div class="k-field"><label>Servicio de inspección</label><select name="service_type"><option value="">— Elegir —</option>${SERVICE_TYPES.map((s) => `<option>${esc(s)}</option>`).join("")}</select></div>
        <div class="k-field span2"><label>Comentarios / Indicaciones</label><textarea name="comments"></textarea></div>
      </div>
      <div class="k-msg" id="msg"></div>
      <button class="k-submit" type="submit" id="submitBtn">Enviar solicitud</button>
    </form>`;

  const form = document.getElementById("kf"), msg = document.getElementById("msg"), btn = document.getElementById("submitBtn");
  form.querySelector('[name="format_id"]').addEventListener("change", (e) => {
    const opt = e.target.selectedOptions[0];
    document.getElementById("partName").textContent = opt?.dataset.name ? `Pieza: ${opt.dataset.name}` : "";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.className = "k-msg"; btn.disabled = true; btn.textContent = "Enviando…";
    const fd = new FormData(form);
    const opt = form.querySelector('[name="format_id"]').selectedOptions[0];
    const payload = {
      company_id: companyId, requester_name: fd.get("requester_name"), requester_email: fd.get("requester_email"),
      shift: fd.get("shift") || null, quantity: fd.get("quantity") ? Number(fd.get("quantity")) : null,
      lot_number: fd.get("lot_number") || null, purchase_order: fd.get("purchase_order") || null,
      format_id: fd.get("format_id"), part_number: opt.textContent.trim(), part_name: opt.dataset.name || "",
      operation_no: fd.get("operation_no") || null, service_type: fd.get("service_type") || null, comments: fd.get("comments") || null,
      status: "pendiente",
    };
    const { error } = await sb.from("inspection_requests").insert(payload);
    if (error) { msg.textContent = "No se pudo enviar la solicitud. Verifica los datos e intenta de nuevo."; msg.className = "k-msg error show"; btn.disabled = false; btn.textContent = "Enviar solicitud"; return; }
    card.innerHTML = `
      <div class="k-success">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
        <h2>Solicitud enviada</h2>
        <p>Gracias, ${esc(payload.requester_name)}. Calidad la atenderá en breve.</p>
        <button class="k-again" id="again">Enviar otra solicitud</button>
      </div>`;
    document.getElementById("again").addEventListener("click", boot);
  });
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
boot();
</script>
</body>
</html>
